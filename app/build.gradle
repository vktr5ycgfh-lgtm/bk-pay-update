plugins { id 'com.android.application' }

android {
    namespace 'com.riderspay.autodriver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.riderspay.autodriver'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2-yellow-ui-beta'
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Generates a QR bitmap entirely on the device. No QR/payment details leave the app.
    implementation 'com.google.zxing:core:3.5.3'
}
