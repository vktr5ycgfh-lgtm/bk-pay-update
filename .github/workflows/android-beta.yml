name: Android beta APK
on:
  workflow_dispatch:
  push:
    branches: [fresh-yellow-ui-v02]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'run-core-tests.sh'
      - '.github/workflows/android-beta.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test fare calculator and GPS math
        run: bash run-core-tests.sh
      - name: Compile installable debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: riders-pay-v0.2-yellow-ui-beta-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
