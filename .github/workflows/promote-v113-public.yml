name: Promote RIDER'S PAY v1.1.3 beta1 to public

on:
  push:
    branches: ["main"]
    paths:
      - "v113release/trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct signed RIDER'S PAY v1.1.3 beta1 public APK
        shell: bash
        run: |
          echo "2df9b558ac609afa6ae32f1f1e9b8e5eec315a79cafd442da220d7e9f33cd1c2  v113release/v113.zstpatch" | sha256sum -c -
          echo "85f298523b6b55684e578d042003f7b8e45f9bd36a019eaf4ef55b9d76ca8432  BK-PAY-latest.apk" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          zstd -d --patch-from=/tmp/base.apk v113release/v113.zstpatch -o BK-PAY-latest.apk -f
          echo "4b4ad353bd8b2d4ed5fd6d4a6ec1e4bc4dc53fd7b8b43d1540ceee921e9107ba  BK-PAY-latest.apk" | sha256sum -c -

      - name: Publish signed public APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already the v1.1.3 beta1 public build."
            exit 0
          fi
          git commit -m "Promote RIDER'S PAY v1.1.3 beta1 to public"
          git push
