name: Verify dual-app ecosystem
on: [workflow_dispatch, push]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.10.2'}
      - uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm, cache-dependency-path: functions/package-lock.json}
      - name: Verify Cloud Functions
        working-directory: functions
        run: npm ci && npm run build
      - name: Verify Android apps
        run: gradle --no-daemon :driver-app:assembleDebug :consumer-app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: unconfigured-debug-apks
          path: |
            driver-app/build/outputs/apk/debug/*.apk
            consumer-app/build/outputs/apk/debug/*.apk
          retention-days: 7
