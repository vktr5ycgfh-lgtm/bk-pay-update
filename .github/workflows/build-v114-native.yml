name: Build RIDERS PAY v1.1.4-beta2 native parts

on:
  push:
    branches: ["main"]
    paths:
      - "v114build/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Compile Java and DEX
        shell: bash
        run: |
          rm -rf v114out
          mkdir -p v114out/classes v114out/dex v114out/res/drawable
          javac -source 8 -target 8 -Xlint:-options             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d v114out/classes             v114build/MainActivity.java v114build/FloatingTripService.java v114build/UpdateProvider.java
          jar cf v114out/appclasses.jar -C v114out/classes .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26             --lib "$ANDROID_HOME/platforms/android-35/android.jar"             --output v114out/dex v114out/appclasses.jar

      - name: Compile manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg=='
          pathlib.Path('v114out/res/drawable/icon.png').write_bytes(base64.b64decode(png))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" compile --dir v114out/res -o v114out/compiled.zip
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" link             -I "$ANDROID_HOME/platforms/android-35/android.jar"             --manifest v114build/AndroidManifest.xml             --min-sdk-version 26 --target-sdk-version 35             --version-code 115 --version-name 1.1.4-beta2             -o v114out/manifest.apk v114out/compiled.zip
          unzip -p v114out/manifest.apk AndroidManifest.xml > v114out/AndroidManifest.xml
          cp v114out/dex/classes.dex v114out/classes.dex
          sha256sum v114out/AndroidManifest.xml v114out/classes.dex
          (cd v114out && zip -q native-parts.zip AndroidManifest.xml classes.dex)

      - name: Upload native parts
        uses: actions/upload-artifact@v4
        with:
          name: riders-pay-v114-native-parts
          path: v114out/native-parts.zip
          retention-days: 3
