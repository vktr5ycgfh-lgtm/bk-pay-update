name: Build RIDERS PAY v1.1.1 native parts

on:
  push:
    branches: ["main"]
    paths:
      - "v111build/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Compile Java and DEX
        shell: bash
        run: |
          rm -rf v111out
          mkdir -p v111out/classes v111out/dex v111out/res/drawable
          javac -source 8 -target 8 -Xlint:-options             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d v111out/classes             v111build/MainActivity.java v111build/FloatingTripService.java v111build/UpdateProvider.java
          jar cf v111out/appclasses.jar -C v111out/classes .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26             --lib "$ANDROID_HOME/platforms/android-35/android.jar"             --output v111out/dex v111out/appclasses.jar

      - name: Compile manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg=='
          pathlib.Path('v111out/res/drawable/icon.png').write_bytes(base64.b64decode(png))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" compile --dir v111out/res -o v111out/compiled.zip
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" link             -I "$ANDROID_HOME/platforms/android-35/android.jar"             --manifest v111build/AndroidManifest.xml             --min-sdk-version 26 --target-sdk-version 35             --version-code 112 --version-name 1.1.1             -o v111out/manifest.apk v111out/compiled.zip
          unzip -p v111out/manifest.apk AndroidManifest.xml > v111out/AndroidManifest.xml
          cp v111out/dex/classes.dex v111out/classes.dex
          sha256sum v111out/AndroidManifest.xml v111out/classes.dex
          (cd v111out && zip -q native-parts.zip AndroidManifest.xml classes.dex)

      - name: Upload native parts
        uses: actions/upload-artifact@v4
        with:
          name: riders-pay-v111-native-parts
          path: v111out/native-parts.zip
          retention-days: 3
