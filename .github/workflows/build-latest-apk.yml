name: Build RIDER'S PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v111patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct RIDER'S PAY v1.1.1
        shell: bash
        run: |
          : > /tmp/v111.zstpatch
          for f in v111patch/part*.txt; do
            base64 -d "$f" >> /tmp/v111.zstpatch
          done
          echo "50ecbcb71e9565f8cac36633d1034ae39952cf55f41c142631b73a21a8ad389b  /tmp/v111.zstpatch" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          echo "cb0022ec022c229923205de4897f5100281e087ac2515341a653e4c00fe3e56e  /tmp/base.apk" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.apk /tmp/v111.zstpatch -o BK-PAY-latest.apk -f
          echo "6e593c3791e8fe1e587b76057f19dc54c2d8c18dfe1663de0be17a8cc6cbd4be  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish RIDER'S PAY v1.1.1 in-app updater"
          git push
