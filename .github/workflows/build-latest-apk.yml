name: Build RIDER'S PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v10patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct RIDER'S PAY v1.0
        shell: bash
        run: |
          : > /tmp/v10.zstpatch
          for f in v10patch/part*.txt; do
            base64 -d "$f" >> /tmp/v10.zstpatch
          done
          echo "faeed49fabfe3add4e9b19757f0cfe6aa72fbbaca064ab1c4908df45e61b4844  /tmp/v10.zstpatch" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          echo "357d5cdc11b1486a687823a9e9f69e68826d38f3245d5f6c683fe5f44e8bd51f  /tmp/base.apk" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.apk /tmp/v10.zstpatch -o BK-PAY-latest.apk -f
          echo "a51fefa4d6b5ff0dd0e96c0f608af87dcb3cad7cd43e80d330bb9003bc5896cc  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish RIDER'S PAY v1.0"
          git push
