name: Build RIDER'S PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v11patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct RIDER'S PAY v1.1
        shell: bash
        run: |
          : > /tmp/v11.zstpatch
          for f in v11patch/part*.txt; do
            base64 -d "$f" >> /tmp/v11.zstpatch
          done
          echo "f965fcc38e22d09bdcfdadbbc50bd961bd8de2b658553a00135baede58dfde19  /tmp/v11.zstpatch" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          echo "a51fefa4d6b5ff0dd0e96c0f608af87dcb3cad7cd43e80d330bb9003bc5896cc  /tmp/base.apk" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.apk /tmp/v11.zstpatch -o BK-PAY-latest.apk -f
          echo "cb0022ec022c229923205de4897f5100281e087ac2515341a653e4c00fe3e56e  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish RIDER'S PAY v1.1 floating duty update"
          git push
