name: Build BK PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v172patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct BK PAY v1.7.2
        shell: bash
        run: |
          : > /tmp/v172.zstpatch
          for f in v172patch/part*.txt; do
            base64 -d "$f" >> /tmp/v172.zstpatch
          done
          echo "ac3d257a944213d04fb8406be42ca6330fbd4b3d26da80012d13ca1ea28e42e3  /tmp/v172.zstpatch" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          echo "5dd37d5d6add84981ed4f7095bd27ec79c60fc4067db245cbe6375d3bf088dc2  /tmp/base.apk" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.apk /tmp/v172.zstpatch -o BK-PAY-latest.apk -f
          echo "357d5cdc11b1486a687823a9e9f69e68826d38f3245d5f6c683fe5f44e8bd51f  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish BK PAY v1.7.2 OTP hotfix"
          git push
