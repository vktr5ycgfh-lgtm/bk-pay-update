name: Build RIDER'S PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v112patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct RIDER'S PAY v1.1.2
        shell: bash
        run: |
          : > /tmp/v112.zstpatch
          for f in v112patch/part*.txt; do
            base64 -d "$f" >> /tmp/v112.zstpatch
          done
          echo "c4fb3d843dd75eb5eed296ef2c8b162ed913671b15347b9112e4aa6c2c1cba56  /tmp/v112.zstpatch" | sha256sum -c -
          cp BK-PAY-latest.apk /tmp/base.apk
          echo "6e593c3791e8fe1e587b76057f19dc54c2d8c18dfe1663de0be17a8cc6cbd4be  /tmp/base.apk" | sha256sum -c -
          zstd -d --patch-from=/tmp/base.apk /tmp/v112.zstpatch -o BK-PAY-latest.apk -f
          echo "85f298523b6b55684e578d042003f7b8e45f9bd36a019eaf4ef55b9d76ca8432  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish RIDER'S PAY v1.1.2 floating QR hotfix"
          git push
