name: Build BK PAY latest APK

on:
  push:
    branches: ["main"]
    paths:
      - "v171patch-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure zstd
        shell: bash
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Reconstruct BK PAY v1.7.1
        shell: bash
        run: |
          cat v171patch/part*.txt | base64 -d > /tmp/v171.zstpatch
          cp BK-PAY-latest.apk /tmp/base.apk
          zstd -d --patch-from=/tmp/base.apk /tmp/v171.zstpatch -o BK-PAY-latest.apk -f
          echo "5dd37d5d6add84981ed4f7095bd27ec79c60fc4067db245cbe6375d3bf088dc2  BK-PAY-latest.apk" | sha256sum -c -

      - name: Commit latest APK
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BK-PAY-latest.apk
          if git diff --cached --quiet; then
            echo "BK-PAY-latest.apk is already current."
            exit 0
          fi
          git commit -m "Publish BK PAY v1.7.1 latest APK"
          git push
