name: Build Android signing tools

on:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/build-apksigner-tool.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Android Build Tools
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0"
          mkdir -p android-signing-tools/lib android-signing-tools/lib64
          cp "$ANDROID_HOME/build-tools/34.0.0/apksigner" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/zipalign" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/aapt" android-signing-tools/ || true
          cp "$ANDROID_HOME/build-tools/34.0.0/aapt2" android-signing-tools/
          cp "$ANDROID_HOME/build-tools/34.0.0/lib/apksigner.jar" android-signing-tools/lib/
          if [ -f "$ANDROID_HOME/build-tools/34.0.0/lib64/libc++.so" ]; then cp "$ANDROID_HOME/build-tools/34.0.0/lib64/libc++.so" android-signing-tools/lib64/; fi
          chmod +x android-signing-tools/apksigner android-signing-tools/zipalign android-signing-tools/aapt* || true
          ./android-signing-tools/apksigner version

      - name: Upload Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools
          path: android-signing-tools
          retention-days: 1
