name: Build RIDERS PAY v1.1.2 native parts

on:
  push:
    branches: ["main"]
    paths:
      - "v112build/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Compile Java and DEX
        shell: bash
        run: |
          rm -rf v112out
          mkdir -p v112out/classes v112out/dex v112out/res/drawable
          javac -source 8 -target 8 -Xlint:-options             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d v112out/classes             v112build/MainActivity.java v112build/FloatingTripService.java v112build/UpdateProvider.java
          jar cf v112out/appclasses.jar -C v112out/classes .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26             --lib "$ANDROID_HOME/platforms/android-35/android.jar"             --output v112out/dex v112out/appclasses.jar

      - name: Compile manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg=='
          pathlib.Path('v112out/res/drawable/icon.png').write_bytes(base64.b64decode(png))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" compile --dir v112out/res -o v112out/compiled.zip
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" link             -I "$ANDROID_HOME/platforms/android-35/android.jar"             --manifest v112build/AndroidManifest.xml             --min-sdk-version 26 --target-sdk-version 35             --version-code 113 --version-name 1.1.2             -o v112out/manifest.apk v112out/compiled.zip
          unzip -p v112out/manifest.apk AndroidManifest.xml > v112out/AndroidManifest.xml
          cp v112out/dex/classes.dex v112out/classes.dex
          sha256sum v112out/AndroidManifest.xml v112out/classes.dex
          (cd v112out && zip -q native-parts.zip AndroidManifest.xml classes.dex)

      - name: Upload native parts
        uses: actions/upload-artifact@v4
        with:
          name: riders-pay-v112-native-parts
          path: v112out/native-parts.zip
          retention-days: 3
