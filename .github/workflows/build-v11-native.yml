name: Build RIDERS PAY v1.1 native parts

on:
  push:
    branches: ["main"]
    paths:
      - "v11build/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"

      - name: Compile Java and DEX
        shell: bash
        run: |
          rm -rf v11out
          mkdir -p v11out/classes v11out/dex v11out/res/drawable
          javac -source 8 -target 8 -Xlint:-options             -cp "$ANDROID_HOME/platforms/android-35/android.jar"             -d v11out/classes v11build/MainActivity.java v11build/FloatingTripService.java
          jar cf v11out/appclasses.jar -C v11out/classes .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26             --lib "$ANDROID_HOME/platforms/android-35/android.jar"             --output v11out/dex v11out/appclasses.jar

      - name: Compile manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, pathlib
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg=='
          pathlib.Path('v11out/res/drawable/icon.png').write_bytes(base64.b64decode(png))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" compile --dir v11out/res -o v11out/compiled.zip
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" link             -I "$ANDROID_HOME/platforms/android-35/android.jar"             --manifest v11build/AndroidManifest.xml             --min-sdk-version 26 --target-sdk-version 35             --version-code 111 --version-name 1.1             -o v11out/manifest.apk v11out/compiled.zip
          unzip -p v11out/manifest.apk AndroidManifest.xml > v11out/AndroidManifest.xml
          cp v11out/dex/classes.dex v11out/classes.dex
          sha256sum v11out/AndroidManifest.xml v11out/classes.dex
          (cd v11out && zip -q native-parts.zip AndroidManifest.xml classes.dex)

      - name: Upload native parts
        uses: actions/upload-artifact@v4
        with:
          name: riders-pay-v11-native-parts
          path: v11out/native-parts.zip
          retention-days: 3
