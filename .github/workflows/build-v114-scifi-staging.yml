name: Compile RIDER'S PAY sci-fi floating UI staging

on:
  push:
    branches: ["main"]
    paths:
      - "v114design/trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure Android SDK packages
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;34.0.0"
      - name: Compile native staging
        shell: bash
        run: |
          rm -rf v114out
          mkdir -p v114out/classes v114out/dex v114out/res/drawable
          javac -source 8 -target 8 -Xlint:-options -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d v114out/classes v114design/MainActivity.java v114design/FloatingTripService.java v114design/UpdateProvider.java
          jar cf v114out/appclasses.jar -C v114out/classes .
          "$ANDROID_HOME/build-tools/34.0.0/d8" --release --min-api 26 --lib "$ANDROID_HOME/platforms/android-35/android.jar" --output v114out/dex v114out/appclasses.jar
          python3 - <<'PY'
          import base64, pathlib
          png='iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR4nGNgaPj/HwAEggJ/59habAAAAABJRU5ErkJggg=='
          pathlib.Path('v114out/res/drawable/icon.png').write_bytes(base64.b64decode(png))
          PY
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" compile --dir v114out/res -o v114out/compiled.zip
          "$ANDROID_HOME/build-tools/34.0.0/aapt2" link -I "$ANDROID_HOME/platforms/android-35/android.jar" --manifest v114design/AndroidManifest.xml --min-sdk-version 26 --target-sdk-version 35 --version-code 115 --version-name 1.1.4-design -o v114out/manifest.apk v114out/compiled.zip
          unzip -p v114out/manifest.apk AndroidManifest.xml > v114out/AndroidManifest.xml
          cp v114out/dex/classes.dex v114out/classes.dex
          (cd v114out && zip -q native-parts.zip AndroidManifest.xml classes.dex)
      - uses: actions/upload-artifact@v4
        with:
          name: riders-pay-scifi-floating-ui-staging
          path: v114out/native-parts.zip
          retention-days: 3
